[package]
name = "mahayana-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "mahayana"
path = "src/main.rs"

[features]
default = []
codex-compat = ["dep:codex-arg0", "dep:codex-cli"]

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
codex-arg0 = { workspace = true, optional = true }
codex-cli = { workspace = true, optional = true }
codex-core-plugins = { package = "mahayana-plugin-archive-compat", path = "../mahayana-plugin-archive-compat" }
codex-tui = { package = "mahayana-tui-compat", path = "../mahayana-tui-compat" }
crossterm.workspace = true
flate2.workspace = true
mahayana-core.workspace = true
mahayana-feature-host = { workspace = true, features = ["production"] }
mahayana-host.workspace = true
mahayana-host-protocol.workspace = true
mahayana-ffi = { path = "../mahayana-ffi" }
mahayana-product = { package = "mahayana-platform-client", path = "../mahayana-product" }
mahayana-miniapp-protocol.workspace = true
mahayana-platform-core.workspace = true
mahayana-plugin-host.workspace = true
mahayana-plugin-runtime.workspace = true
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
rpassword.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio.workspace = true
unicode-width.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
insta = "1.46.3"
